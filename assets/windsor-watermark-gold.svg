      <stop offset="0%" stop-color="#FDF0CD"/>
      <stop offset="35%" stop-color="#E5C158"/>
      <stop offset="70%" stop-color="#D4AF37"/>
      <stop offset="100%" stop-color="#AA820A"/>
    </linearGradient>
    <filter id="wmShadow" x="-10%" y="-10%" width="120%" height="120%">
