<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%">
  <defs>
    <linearGradient id="goldCrownGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDF0CD"/>
      <stop offset="25%" stop-color="#E5C158"/>
      <stop offset="55%" stop-color="#D4AF37"/>
      <stop offset="85%" stop-color="#AA820A"/>
      <stop offset="100%" stop-color="#7B5B00"/>
    </linearGradient>
    <filter id="crownGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#000000" flood-opacity="0.5"/>
    </filter>
  </defs>

  <!-- Crown Vector Mark -->
  <g filter="url(#crownGlow)">
    <!-- Base band -->
    <path d="M 22 74 L 78 74 A 2 2 0 0 1 80 76 L 80 79 A 3 3 0 0 1 77 82 L 23 82 A 3 3 0 0 1 20 79 L 20 76 A 2 2 0 0 1 22 74 Z" fill="url(#goldCrownGrad)" />
    <!-- Jewels on base -->
    <circle cx="32" cy="78" r="1.8" fill="#FFFFFF" opacity="0.9"/>
    <circle cx="50" cy="78" r="2.2" fill="#FFFFFF" opacity="0.95"/>
    <circle cx="68" cy="78" r="1.8" fill="#FFFFFF" opacity="0.9"/>

    <!-- Main 3-Point Royal Crown Body -->
    <path d="M 20 72 
             L 16 38 
             L 34 52 
             L 50 24 
             L 66 52 
             L 84 38 
             L 80 72 
             Z" 
          fill="url(#goldCrownGrad)" />

    <!-- 3 Spherical finials on crown peaks -->
    <circle cx="16" cy="36" r="4.2" fill="url(#goldCrownGrad)"/>
    <circle cx="16" cy="35" r="1.5" fill="#FFFFFF" opacity="0.8"/>

    <circle cx="50" cy="22" r="5.2" fill="url(#goldCrownGrad)"/>
    <circle cx="50" cy="20.5" r="1.8" fill="#FFFFFF" opacity="0.9"/>

    <circle cx="84" cy="36" r="4.2" fill="url(#goldCrownGrad)"/>
    <circle cx="84" cy="35" r="1.5" fill="#FFFFFF" opacity="0.8"/>
  </g>
</svg>
