<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 320" width="100%" height="100%">
  <defs>
    <linearGradient id="badgeGoldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDF0CD"/>
      <stop offset="25%" stop-color="#E5C158"/>
      <stop offset="55%" stop-color="#D4AF37"/>
      <stop offset="85%" stop-color="#AA820A"/>
      <stop offset="100%" stop-color="#7B5B00"/>
    </linearGradient>
    <linearGradient id="badgeBgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#141E33"/>
      <stop offset="50%" stop-color="#0B132B"/>
      <stop offset="100%" stop-color="#080C16"/>
    </linearGradient>
    <filter id="badgeGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.6"/>
    </filter>
  </defs>

  <!-- Outer Luxury Container Shield / Card -->
  <rect x="15" y="15" width="290" height="290" rx="36" fill="url(#badgeBgGrad)" stroke="url(#badgeGoldGrad)" stroke-width="2.5" filter="url(#badgeGlow)"/>

  <!-- Subtle Inner Border -->
  <rect x="23" y="23" width="274" height="274" rx="28" fill="none" stroke="rgba(212,175,55,0.25)" stroke-width="1"/>

  <!-- Crown Mark Centered -->
  <g transform="translate(110, 48) scale(1.0)">
    <path d="M 22 74 L 78 74 A 2 2 0 0 1 80 76 L 80 79 A 3 3 0 0 1 77 82 L 23 82 A 3 3 0 0 1 20 79 L 20 76 A 2 2 0 0 1 22 74 Z" fill="url(#badgeGoldGrad)" />
    <circle cx="32" cy="78" r="1.8" fill="#FFFFFF" opacity="0.9"/>
    <circle cx="50" cy="78" r="2.2" fill="#FFFFFF" opacity="0.95"/>
    <circle cx="68" cy="78" r="1.8" fill="#FFFFFF" opacity="0.9"/>
    <path d="M 20 72 L 16 38 L 34 52 L 50 24 L 66 52 L 84 38 L 80 72 Z" fill="url(#badgeGoldGrad)" />
    <circle cx="16" cy="36" r="4.2" fill="url(#badgeGoldGrad)"/>
    <circle cx="16" cy="35" r="1.5" fill="#FFFFFF" opacity="0.8"/>
    <circle cx="50" cy="22" r="5.2" fill="url(#badgeGoldGrad)"/>
    <circle cx="50" cy="20.5" r="1.8" fill="#FFFFFF" opacity="0.9"/>
    <circle cx="84" cy="36" r="4.2" fill="url(#badgeGoldGrad)"/>
    <circle cx="84" cy="35" r="1.5" fill="#FFFFFF" opacity="0.8"/>
  </g>

  <!-- Center Typography -->
  <text x="160" y="185" text-anchor="middle" font-family="'Outfit', -apple-system, sans-serif" font-weight="900" font-size="28" letter-spacing="1" fill="#FFFFFF">
    WINDSOR
  </text>
  <text x="160" y="218" text-anchor="middle" font-family="'Outfit', -apple-system, sans-serif" font-weight="900" font-size="28" letter-spacing="1.5" fill="url(#badgeGoldGrad)">
    SPRAYING
  </text>

  <!-- Gold Divider Line -->
  <line x1="80" y1="236" x2="240" y2="236" stroke="url(#badgeGoldGrad)" stroke-width="1.5" opacity="0.6"/>

  <!-- Subtitle Tagline -->
  <text x="160" y="258" text-anchor="middle" font-family="'Inter', -apple-system, sans-serif" font-weight="800" font-size="10.5" letter-spacing="2.5" fill="#E2E8F0">
    UPVC · WINDOWS · KITCHENS
  </text>
  <text x="160" y="276" text-anchor="middle" font-family="'Inter', -apple-system, sans-serif" font-weight="700" font-size="9.5" letter-spacing="1.5" fill="url(#badgeGoldGrad)">
    10-YEAR GUARANTEE
  </text>
</svg>
