<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="100%" height="100%">
  <defs>
    <linearGradient id="crownGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFBEB"/>
      <stop offset="25%" stop-color="#FDE68A"/>
      <stop offset="60%" stop-color="#D4AF37"/>
      <stop offset="100%" stop-color="#B45309"/>
    </linearGradient>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E293B"/>
      <stop offset="100%" stop-color="#080D1C"/>
    </linearGradient>
    <filter id="goldGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#D97706" flood-opacity="0.35"/>
    </filter>
  </defs>
  <!-- Background Obsidian Card -->
  <rect x="3" y="3" width="114" height="114" rx="24" fill="url(#bgGrad)" stroke="#D4AF37" stroke-width="2.5" stroke-opacity="0.5"/>
  <!-- Inner Highlight Rim -->
  <rect x="8" y="8" width="104" height="104" rx="19" fill="none" stroke="rgba(255,255,255,0.1)" stroke-width="1"/>
  <!-- Royal 3-Point Crown -->
  <g filter="url(#goldGlow)">
    <path d="M26 80 L34 44 L50 60 L60 32 L70 60 L86 44 L94 80 Z" fill="url(#crownGold)"/>
    <rect x="25" y="81" width="70" height="10" rx="3" fill="url(#crownGold)"/>
    <!-- Jewels on Crown Points -->
    <circle cx="34" cy="41" r="4.5" fill="#FFFBEB" stroke="#B45309" stroke-width="1"/>
    <circle cx="60" cy="28" r="5.5" fill="#FFFBEB" stroke="#B45309" stroke-width="1"/>
    <circle cx="86" cy="41" r="4.5" fill="#FFFBEB" stroke="#B45309" stroke-width="1"/>
    <!-- Headband Jewels -->
    <circle cx="43" cy="86" r="2.5" fill="#080D1C"/>
    <circle cx="60" cy="86" r="3" fill="#080D1C"/>
    <circle cx="77" cy="86" r="2.5" fill="#080D1C"/>
  </g>
</svg>
